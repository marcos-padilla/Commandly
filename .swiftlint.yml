disabled_rules:
  - trailing_whitespace
  - todo
  - opening_brace

opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - joined_default_parameter
  - modifier_order
  - override_in_extension
  - pattern_matching_keywords
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

excluded:
  - .derivedData
  - Packages/.build
  - .swiftpm
  - vendor

line_length: 140
reporter: xcode

force_cast: error
force_try: error
force_unwrapping: error

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y

type_name:
  min_length: 3

cyclomatic_complexity:
  warning: 12
  error: 20

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 50
  error: 80

type_body_length:
  warning: 250
  error: 350
